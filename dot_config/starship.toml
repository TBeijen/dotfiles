# Starship prompt — powerline style with tbnl color palette
# Toggle back to oh-my-posh: export USE_STARSHIP=false
# Palette hex values: bg_grey_light=#5b64a4, bg_grey=#202237, terminal_bg=#0d1117 (Ghostty GitHub Dark Default)
#  = solid right arrow U+E0B0,  = thin right arrow U+E0B1
# Separators are included in each module's format so they hide with the module

add_newline = false

# Only fixed separators remain here: status→time transition, and closing arrow.
# All thin separators between conditional modules are inside each module's format.
format = """
$status\
[](fg:#5b64a4 bg:#202237)\
$time\
$aws\
$azure\
$kubernetes\
$python\
$nodejs\
[](fg:#0d1117 bg:#202237)\
$directory\
$git_branch\
$git_status\
${custom.prod_warning}\
${custom.sandbox}\
[](fg:#202237)\
$character"""

palette = "tbnl"

[palettes.tbnl]
aws_orange = "#ff9900"
azure_blue = "#0a95ff"
k8s_blue = "#326CE5"
nodejs_green = "#84ba64"
gold = "#afaf00"
cyan = "#00ffd7"
dark_slate_grey = "#87d7d7"
red_bright = "#f00a55"
bg_grey = "#202237"
bg_grey_light = "#5b64a4"
white = "#E0DEF4"
yellow = "#F3AE35"
green = "#59C9A5"

[status]
disabled = false
format = "[ $symbol ]($style)"
symbol = "✓"
not_executable_symbol = "✗"
success_style = "fg:white bg:bg_grey_light"
style = "fg:white bg:red_bright"
map_symbol = true
success_symbol = "✓"

[time]
disabled = false
format = "[  $time ]($style)"
time_format = "%H:%M | %a"
style = "fg:white bg:bg_grey"

# Separator included in format — hides when no AWS profile active
[aws]
disabled = false
format = "[](fg:#0d1117 bg:#202237)[ $symbol$profile ]($style)"
symbol = " "
style = "fg:aws_orange bg:bg_grey"

# Separator included in format — hides when no Azure subscription active
[azure]
disabled = false
format = "[](fg:#0d1117 bg:#202237)[ $symbol$subscription ]($style)"
symbol = " "
style = "fg:azure_blue bg:bg_grey"

# Separator included in format — hides when KUBECONFIG not set
[kubernetes]
disabled = false
detect_env_vars = ["KUBECONFIG"]
detect_files = []
detect_folders = []
detect_extensions = []
format = "[](fg:#0d1117 bg:#202237)[ ☸ $context( :: $namespace) ]($style)"
style = "fg:k8s_blue bg:bg_grey"

# Separator included in format — hides when no virtualenv active
[python]
disabled = false
detect_extensions = []
detect_files = []
detect_folders = []
format = "[](fg:#0d1117 bg:#202237)[ $symbol$virtualenv ]($style)"
symbol = " "
style = "fg:gold bg:bg_grey"
python_binary = ["python3", "python"]

# Separator included in format — hides when no .mise.toml / node project
[nodejs]
disabled = false
detect_extensions = []
detect_files = []
detect_folders = []
format = "[](fg:#0d1117 bg:#202237)[ $symbol$version ]($style)"
symbol = " "
style = "fg:nodejs_green bg:bg_grey"

# Directory always shown — fixed separator before it in main format
[directory]
format = "[  $path ]($style)"
style = "fg:cyan bg:bg_grey"
truncation_length = 3
truncation_symbol = "…/"

# Separator included in format — hides outside git repos
[git_branch]
format = "[](fg:#0d1117 bg:#202237)[  $branch(:$remote_branch) ]($style)"
style = "fg:dark_slate_grey bg:bg_grey"
truncation_length = 25

[git_status]
format = "[$all_status$ahead_behind]($style)"
style = "fg:yellow bg:bg_grey"
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇡${ahead_count}⇣${behind_count} "
modified = "✎${count} "
staged = "✚${count} "
untracked = "?${count} "
conflicted = "=${count} "
stashed = ""

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

# Sandbox indicator — shows when inside nono or devcontainer
[custom.sandbox]
command = "echo sandbox"
when = '[ -n "$NONO_PROFILE" ] || [ -n "$DEVCONTAINER" ] || [ -f /.dockerenv ]'
format = "[](fg:#0d1117 bg:#202237)[  $output ]($style)"
style = "bold fg:green bg:bg_grey"

# Production warning — last segment before closing arrow
[custom.prod_warning]
command = "echo '!!!'"
when = '''case "${AWS_PROFILE:-}${KUBECONFIG:-}" in *non-prod*|*nonprod*) exit 1;; *prod*) exit 0;; *) exit 1;; esac'''
format = "[](fg:#0d1117 bg:#202237)[ $output ]($style)"
style = "bold fg:white bg:red_bright"
